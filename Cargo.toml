[workspace]
resolver = "2"
members = ["crates/ir", "crates/check", "crates/emit_ts", "crates/syntax", "crates/pack", "crates/cli", "crates/canon"]
exclude = ["vendor", "examples"]
default-members = ["crates/ir", "crates/check", "crates/emit_ts", "crates/syntax", "crates/pack", "crates/cli", "crates/canon"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.10.2"

# Line tables only: panics and backtraces keep their locations, and linking
# the test binaries is about a quarter faster. Overflow checks and debug
# assertions stay on; the differential tests rely on them.
[profile.dev]
debug = "line-tables-only"
