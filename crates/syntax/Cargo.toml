[package]
name = "purecrate-syntax"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "syn → PureCrate IR. No filesystem I/O."

[dependencies]
purecrate-ir = { path = "../ir" }
proc-macro2 = { version = "1.0.78", default-features = false, features = ["span-locations"] }
syn = { version = "2.0.52", default-features = false, features = ["clone-impls", "extra-traits", "full", "parsing", "printing", "visit-mut"] }
