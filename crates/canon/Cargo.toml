[package]
name = "purecrate-canon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Test-only: includes a fixture and derives its canonical `Show` from the PureCrate IR."

[lib]
proc-macro = true

[dependencies]
purecrate-ir = { path = "../ir" }
purecrate-syntax = { path = "../syntax" }
proc-macro2 = { path = "../../vendor/proc-macro2-1.0.78", default-features = false, features = ["span-locations"] }
syn = { path = "../../vendor/syn-2.0.52", default-features = false, features = ["full", "parsing", "printing", "clone-impls"] }
quote = { path = "../../vendor/quote-1.0.35", default-features = false }
