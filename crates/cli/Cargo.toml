[package]
name = "purecrate-ts"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI: read a PureCrate source file and write a TS package"

[dependencies]
purecrate-ir = { path = "../ir" }
purecrate-syntax = { path = "../syntax" }
purecrate-check = { path = "../check" }
purecrate-pack = { path = "../pack" }
purecrate-emit-ts = { path = "../emit_ts" }

[dev-dependencies]
purecrate-canon = { path = "../canon" }
# Test-only oracle for the wire format: what a Rust server writes (design/04).
serde_core = { version = "=1.0.228", features = ["rc"] }
serde_json = { version = "=1.0.145" }
uuid = { version = "=1.26.1", default-features = false, features = ["std", "serde"] }
