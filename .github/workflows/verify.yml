# On every push and pull request: rustfmt and clippy (lint), then
# scripts/verify.sh without them: cargo tests (goldens, Rust/TS differential
# tests, wire tests), check on every example, and tsc on TypeScript 6 and 7.
# Rust and Node come from flake.nix, as locally.
name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - name: rustfmt
        run: nix develop --command cargo fmt --all -- --check
      - name: clippy
        run: nix develop --command cargo clippy --offline --all-targets -- -D warnings

  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - name: Install the schema libraries (adapters and examples) and the examples' linter
        run: |
          for p in packages/boundary-zod packages/boundary-valibot packages/boundary-arktype examples; do
            nix develop --command npm ci --ignore-scripts --prefix "$p"
          done
      - name: Verify
        run: nix develop --command ./scripts/verify.sh
        env:
          PURECRATE_SKIP_LINT: "1"
