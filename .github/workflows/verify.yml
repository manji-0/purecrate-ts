# scripts/verify.sh on every push and pull request: cargo tests (goldens,
# Rust/TS differential tests, wire tests), check on every example, and tsc
# on TypeScript 6 and 7. Rust and Node come from flake.nix, as locally.
name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31.11.1
      - name: Install schema adapters' dependencies
        run: |
          for p in boundary-zod boundary-valibot boundary-arktype; do
            nix develop --command npm ci --ignore-scripts --prefix "packages/$p"
          done
      - name: Verify
        run: nix develop --command ./scripts/verify.sh
